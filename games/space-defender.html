<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Space Defender - Free Online Space Game | PlayNova</title>

<meta name="description" content="Play Space Defender for free on PlayNova. Defend your spaceship, destroy incoming enemies and survive as long as possible in this exciting browser space game.">

<meta name="keywords" content="Space Defender, space game, free online space game, spaceship game, shooting game, browser game, PlayNova">

<meta name="robots" content="index, follow">

<link rel="canonical" href="https://sarimsakhi31-hash.github.io/PlayNova/games/space-defender.html">

<meta property="og:title" content="Space Defender - Free Online Space Game | PlayNova">
<meta property="og:description" content="Defend your spaceship and destroy incoming enemies in this free browser space game on PlayNova.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://sarimsakhi31-hash.github.io/PlayNova/games/space-defender.html">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#03030a;
  color:white;
  font-family:Arial,sans-serif;
  text-align:center;
  padding:15px;
}

.game{
  width:min(95vw,600px);
  margin:auto;
}

h1{
  color:#66e6ff;
  margin:8px 0;
}

.info{
  color:#aaa;
  margin-bottom:12px;
}

.stats{
  display:flex;
  justify-content:center;
  gap:10px;
  margin-bottom:12px;
}

.stat{
  background:#111525;
  padding:9px 18px;
  border-radius:10px;
}

.stat span{
  color:#66e6ff;
  font-weight:bold;
}

.space{
  position:relative;
  width:100%;
  height:520px;
  max-height:70vh;
  overflow:hidden;
  background:
    radial-gradient(circle at 20% 20%,#fff 0 1px,transparent 2px),
    radial-gradient(circle at 70% 30%,#fff 0 1px,transparent 2px),
    radial-gradient(circle at 40% 70%,#fff 0 1px,transparent 2px),
    radial-gradient(circle at 85% 80%,#fff 0 1px,transparent 2px),
    #050515;
  border:3px solid #303bff;
  border-radius:15px;
}

.player{
  position:absolute;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  width:50px;
  height:55px;
  background:#00d9ff;
  clip-path:polygon(50% 0,100% 100%,50% 75%,0 100%);
  box-shadow:0 0 20px #00d9ff;
}

.enemy{
  position:absolute;
  width:42px;
  height:30px;
  background:#ff3158;
  border-radius:50% 50% 40% 40%;
  box-shadow:0 0 15px #ff3158;
}

.bullet{
  position:absolute;
  width:5px;
  height:18px;
  background:#ffe600;
  border-radius:5px;
  box-shadow:0 0 10px #ffe600;
}

.enemyBullet{
  position:absolute;
  width:5px;
  height:15px;
  background:#ff4d00;
  border-radius:5px;
}

.controls{
  margin-top:15px;
  display:flex;
  justify-content:center;
  gap:12px;
}

.controls button,
.shoot,
.restart{
  border:0;
  border-radius:10px;
  padding:13px 22px;
  background:#151a30;
  color:white;
  font-size:18px;
  cursor:pointer;
}

.controls button:hover,
.shoot:hover,
.restart:hover{
  background:#29315c;
}

.shoot{
  margin-top:12px;
  background:#006b8f;
}

.restart{
  margin-top:10px;
  background:#303bff;
}

#message{
  min-height:25px;
  margin-top:12px;
  color:#ffe600;
  font-weight:bold;
}

.gameover{
  color:#ff3158 !important;
}

@media(max-width:500px){
  .space{
    height:500px;
  }
}
</style>

</head>

<body>

<div class="game">

<h1>🚀 Space Defender</h1>

<div class="info">
Defend your ship and destroy the incoming enemies!
</div>

<div class="stats">

<div class="stat">
Score: <span id="score">0</span>
</div>

<div class="stat">
Lives: <span id="lives">3</span>
</div>

</div>

<div class="space" id="space">

<div class="player" id="player"></div>

</div>

<div class="controls">

<button onclick="moveLeft()">⬅️</button>
<button onclick="moveRight()">➡️</button>

</div>

<button class="shoot" onclick="shoot()">
🔫 SHOOT
</button>

<br>

<button class="restart" onclick="startGame()">
🔄 Restart
</button>

<div id="message"></div>

</div>

<script>

const space=document.getElementById("space");
const player=document.getElementById("player");

let playerX=50;
let score=0;
let lives=3;
let running=false;

let enemies=[];
let bullets=[];

let enemyTimer;
let gameLoop;

function setPlayer(){

  player.style.left=playerX+"%";

}

function moveLeft(){

  if(!running)return;

  playerX-=7;

  if(playerX<7)
    playerX=7;

  setPlayer();

}

function moveRight(){

  if(!running)return;

  playerX+=7;

  if(playerX>93)
    playerX=93;

  setPlayer();

}

document.addEventListener("keydown",function(e){

  if(e.key==="ArrowLeft")
    moveLeft();

  if(e.key==="ArrowRight")
    moveRight();

  if(e.code==="Space"){
    e.preventDefault();
    shoot();
  }

});

function shoot(){

  if(!running)return;

  const bullet=document.createElement("div");

  bullet.className="bullet";

  bullet.style.left=playerX+"%";
  bullet.style.bottom="70px";

  space.appendChild(bullet);

  bullets.push({
    element:bullet,
    x:playerX,
    y:space.clientHeight-70
  });

}

function createEnemy(){

  if(!running)return;

  const enemy=document.createElement("div");

  enemy.className="enemy";

  const x=8+Math.random()*84;

  enemy.style.left=x+"%";
  enemy.style.top="-40px";

  space.appendChild(enemy);

  enemies.push({
    element:enemy,
    x:x,
    y:-40,
    speed:1.5+Math.random()*1.5
  });

}

function hit(a,b){

  const r1=a.getBoundingClientRect();
  const r2=b.getBoundingClientRect();

  return !(
    r1.right<r2.left ||
    r1.left>r2.right ||
    r1.bottom<r2.top ||
    r1.top>r2.bottom
  );

}

function update(){

  if(!running)return;

  /* Bullets */

  bullets.forEach((b,i)=>{

    b.y-=8;

    b.element.style.bottom=
      (space.clientHeight-b.y)+"px";

    if(b.y<0){

      b.element.remove();
      bullets.splice(i,1);
      return;

    }

    /* Enemy collision */

    enemies.forEach((e,j)=>{

      if(
        e.element &&
        b.element &&
        hit(b.element,e.element)
      ){

        e.element.remove();
        b.element.remove();

        enemies.splice(j,1);
        bullets.splice(i,1);

        score+=10;

        document.getElementById("score")
          .textContent=score;

      }

    });

  });

  /* Enemies */

  enemies.forEach((e,i)=>{

    e.y+=e.speed;

    e.element.style.top=e.y+"px";

    if(e.y>space.clientHeight-80){

      e.element.remove();

      enemies.splice(i,1);

      lives--;

      document.getElementById("lives")
        .textContent=lives;

      if(lives<=0){

        endGame();

      }

    }

  });

  gameLoop=requestAnimationFrame(update);

}

function startGame(){

  cancelAnimationFrame(gameLoop);
  clearInterval(enemyTimer);

  enemies.forEach(e=>e.element.remove());
  bullets.forEach(b=>b.element.remove());

  enemies=[];
  bullets=[];

  score=0;
  lives=3;
  playerX=50;

  document.getElementById("score").textContent="0";
  document.getElementById("lives").textContent="3";
  document.getElementById("message").textContent="";
  document.getElementById("message").className="";

  setPlayer();

  running=true;

  enemyTimer=setInterval(createEnemy,900);

  gameLoop=requestAnimationFrame(update);

}

function endGame(){

  if(!running)return;

  running=false;

  clearInterval(enemyTimer);
  cancelAnimationFrame(gameLoop);

  const message=document.getElementById("message");

  message.textContent=
    "💥 Game Over! Final Score: "+score;

  message.className="gameover";

}

setPlayer();
startGame();

</script>

</body>
</html>

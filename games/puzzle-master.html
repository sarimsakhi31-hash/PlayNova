<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Puzzle Master</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#09090d;
  color:white;
  font-family:Arial,sans-serif;
  text-align:center;
  min-height:100vh;
  padding:20px;
}

.game{
  max-width:500px;
  margin:auto;
}

h1{
  color:#c77dff;
  margin-bottom:5px;
}

.info{
  color:#aaa;
  margin-bottom:18px;
}

.board{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  background:#15151d;
  padding:10px;
  border-radius:15px;
}

.tile{
  aspect-ratio:1;
  background:#252535;
  border:0;
  border-radius:10px;
  color:white;
  font-size:28px;
  font-weight:bold;
  cursor:pointer;
}

.tile:hover{
  background:#7139a8;
}

.empty{
  background:#09090d;
  cursor:default;
}

button.restart{
  margin-top:20px;
  padding:12px 25px;
  border:0;
  border-radius:10px;
  background:#9b4dca;
  color:white;
  font-size:16px;
  cursor:pointer;
}

#win{
  color:#70e000;
  font-weight:bold;
  margin-top:15px;
  min-height:24px;
}
</style>
</head>

<body>

<div class="game">

<h1>🧩 Puzzle Master</h1>

<div class="info">
Arrange the numbers from 1 to 15
</div>

<div id="board" class="board"></div>

<button class="restart" onclick="startGame()">
🔄 New Game
</button>

<div id="win"></div>

</div>

<script>

let tiles=[];

function startGame(){

  tiles=[...Array(15).keys()].map(x=>x+1);
  tiles.push(0);

  /* Shuffle */
  for(let i=0;i<300;i++){

    let empty=tiles.indexOf(0);
    let moves=[];

    if(empty>=4) moves.push(empty-4);
    if(empty<12) moves.push(empty+4);
    if(empty%4!==0) moves.push(empty-1);
    if(empty%4!==3) moves.push(empty+1);

    let move=moves[Math.floor(Math.random()*moves.length)];

    [tiles[empty],tiles[move]]=
    [tiles[move],tiles[empty]];
  }

  document.getElementById("win").textContent="";
  draw();
}

function draw(){

  const board=document.getElementById("board");

  board.innerHTML="";

  tiles.forEach((n,i)=>{

    const b=document.createElement("button");

    b.className="tile";

    if(n===0){

      b.classList.add("empty");
      b.textContent="";

    }else{

      b.textContent=n;
      b.onclick=()=>move(i);

    }

    board.appendChild(b);

  });
}

function move(i){

  let empty=tiles.indexOf(0);

  let valid=[
    empty-1,
    empty+1,
    empty-4,
    empty+4
  ];

  /* Prevent left/right wrapping */
  if(i===empty-1 && empty%4===0) return;
  if(i===empty+1 && empty%4===3) return;

  if(valid.includes(i)){

    [tiles[i],tiles[empty]]=
    [tiles[empty],tiles[i]];

    draw();

    if(
      tiles.join(",") ===
      [...Array(15).keys()]
      .map(x=>x+1)
      .concat(0)
      .join(",")
    ){

      document.getElementById("win").textContent=
      "🎉 Congratulations! You solved it!";
    }
  }
}

startGame();

</script>

</body>
</html>

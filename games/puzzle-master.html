<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Puzzle Master</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #09090d;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  min-height: 100vh;
  padding: 20px;
}

.game {
  max-width: 500px;
  margin: auto;
}

h1 {
  color: #c77dff;
  margin-bottom: 5px;
}

.info {
  color: #aaa;
  margin-bottom: 15px;
}

.stats {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin-bottom: 15px;
}

.stat {
  background: #191922;
  padding: 10px 18px;
  border-radius: 10px;
  min-width: 110px;
}

.stat span {
  display: block;
  color: #c77dff;
  font-size: 20px;
  font-weight: bold;
  margin-top: 4px;
}

.board {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  background: #15151d;
  padding: 10px;
  border-radius: 15px;
}

.tile {
  aspect-ratio: 1;
  background: #252535;
  border: 0;
  border-radius: 10px;
  color: white;
  font-size: 28px;
  font-weight: bold;
  cursor: pointer;
}

.tile:hover {
  background: #7139a8;
}

.empty {
  background: #09090d;
  cursor: default;
}

button.restart {
  margin-top: 20px;
  padding: 12px 25px;
  border: 0;
  border-radius: 10px;
  background: #9b4dca;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

button.restart:hover {
  background: #b96be8;
}

#win {
  color: #70e000;
  font-weight: bold;
  margin-top: 15px;
  min-height: 24px;
  font-size: 18px;
}

@media (max-width: 500px) {
  body {
    padding: 12px;
  }

  .tile {
    font-size: 22px;
  }
}
</style>
</head>

<body>

<div class="game">

<h1>🧩 Puzzle Master</h1>

<div class="info">
Arrange the numbers from 1 to 15
</div>

<div class="stats">

<div class="stat">
Moves
<span id="moves">0</span>
</div>

<div class="stat">
Time
<span id="time">00:00</span>
</div>

</div>

<div class="board" id="board"></div>

<button class="restart" onclick="startGame()">
🔄 New Game
</button>

<div id="win"></div>

</div>

<script>

let tiles = [];
let moves = 0;
let seconds = 0;
let timer = null;

function startGame() {

  clearInterval(timer);

  moves = 0;
  seconds = 0;

  document.getElementById("moves").textContent = "0";
  document.getElementById("time").textContent = "00:00";
  document.getElementById("win").textContent = "";

  tiles = [...Array(15).keys()].map(x => x + 1);
  tiles.push(0);

  // Shuffle
  for (let i = 0; i < 300; i++) {

    let empty = tiles.indexOf(0);
    let possible = [];

    if (empty >= 4)
      possible.push(empty - 4);

    if (empty < 12)
      possible.push(empty + 4);

    if (empty % 4 !== 0)
      possible.push(empty - 1);

    if (empty % 4 !== 3)
      possible.push(empty + 1);

    let move = possible[Math.floor(Math.random() * possible.length)];

    [tiles[empty], tiles[move]] =
    [tiles[move], tiles[empty]];
  }

  draw();

  timer = setInterval(function() {

    seconds++;

    let min = Math.floor(seconds / 60);
    let sec = seconds % 60;

    document.getElementById("time").textContent =
      String(min).padStart(2, "0") + ":" +
      String(sec).padStart(2, "0");

  }, 1000);
}

function draw() {

  const board = document.getElementById("board");

  board.innerHTML = "";

  tiles.forEach((n, i) => {

    const b = document.createElement("button");

    b.className = n === 0 ? "tile empty" : "tile";

    b.textContent = n === 0 ? "" : n;

    if (n !== 0) {
      b.onclick = () => moveTile(i);
    }

    board.appendChild(b);
  });
}

function moveTile(i) {

  const empty = tiles.indexOf(0);

  const valid =
    i === empty - 1 ||
    i === empty + 1 ||
    i === empty - 4 ||
    i === empty + 4;

  // Prevent left/right crossing
  if (Math.floor(i / 4) !== Math.floor(empty / 4) &&
      Math.abs(i - empty) === 1) {
    return;
  }

  if (!valid)
    return;

  [tiles[i], tiles[empty]] =
  [tiles[empty], tiles[i]];

  moves++;

  document.getElementById("moves").textContent = moves;

  draw();

  checkWin();
}

function checkWin() {

  for (let i = 0; i < 15; i++) {

    if (tiles[i] !== i + 1)
      return;
  }

  clearInterval(timer);

  document.getElementById("win").textContent =
    "🏆 Congratulations! You solved it!";

}

startGame();

</script>

</body>
</html>

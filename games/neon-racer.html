<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Neon Racer - Free Online Racing Game | PlayNova</title>

<meta name="description" content="Play Neon Racer for free on PlayNova. Avoid traffic, dodge obstacles and survive as long as possible in this exciting browser racing game.">

<meta name="keywords" content="Neon Racer, free racing game, online racing game, browser racing game, car game, traffic game, PlayNova">

<meta property="og:type" content="website">
<meta property="og:url" content="https://sarimsakhi31-hash.github.io/PlayNova/games/neon-racer.html">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#050509;
  color:white;
  font-family:Arial,sans-serif;
  text-align:center;
  padding:15px;
}

.game{
  width:min(95vw,500px);
  margin:auto;
}

h1{
  color:#00eaff;
  margin:8px 0;
}

.info{
  color:#aaa;
  margin-bottom:12px;
}

.stats{
  display:flex;
  justify-content:center;
  gap:10px;
  margin-bottom:12px;
}

.stat{
  background:#15151d;
  padding:9px 18px;
  border-radius:10px;
}

.stat span{
  color:#00eaff;
  font-weight:bold;
}

.road{
  position:relative;
  width:100%;
  height:520px;
  max-height:70vh;
  overflow:hidden;
  background:#222;
  border-left:5px solid #00eaff;
  border-right:5px solid #ff00d4;
  border-radius:15px;
}

.lane{
  position:absolute;
  top:0;
  width:5px;
  height:100%;
  background:repeating-linear-gradient(
    to bottom,
    white 0 45px,
    transparent 45px 90px
  );
  opacity:.5;
}

.lane.one{left:33.33%}
.lane.two{left:66.66%}

.car{
  position:absolute;
  bottom:25px;
  left:50%;
  transform:translateX(-50%);
  width:55px;
  height:90px;
  background:#00eaff;
  border-radius:12px 12px 8px 8px;
  box-shadow:0 0 20px #00eaff;
}

.car:before,
.car:after{
  content:"";
  position:absolute;
  width:12px;
  height:25px;
  background:#050509;
  top:18px;
  border-radius:4px;
}

.car:before{left:-7px}
.car:after{right:-7px}

.obstacle{
  position:absolute;
  width:55px;
  height:80px;
  background:#ff1744;
  border-radius:10px;
  box-shadow:0 0 18px #ff1744;
}

.controls{
  margin-top:15px;
  display:flex;
  justify-content:center;
  gap:15px;
}

.controls button,
.restart{
  border:0;
  border-radius:10px;
  padding:13px 25px;
  background:#15151d;
  color:white;
  font-size:18px;
  cursor:pointer;
}

.controls button:hover,
.restart:hover{
  background:#33334a;
}

.restart{
  margin-top:12px;
  background:#007f99;
}

#message{
  min-height:25px;
  margin-top:12px;
  color:#ffdf4d;
  font-weight:bold;
}

.gameover{
  color:#ff1744 !important;
}
</style>

</head>

<body>

<div class="game">

<h1>🏎️ Neon Racer</h1>

<div class="info">
Avoid the traffic and survive as long as possible!
</div>

<div class="stats">

<div class="stat">
Score: <span id="score">0</span>
</div>

<div class="stat">
Best: <span id="best">0</span>
</div>

</div>

<div class="road" id="road">

<div class="lane one"></div>
<div class="lane two"></div>

<div class="car" id="car"></div>

</div>

<div class="controls">

<button onclick="moveLeft()">⬅️</button>
<button onclick="moveRight()">➡️</button>

</div>

<button class="restart" onclick="startGame()">
🔄 Restart
</button>

<div id="message"></div>

</div>

<script>

const road = document.getElementById("road");
const car = document.getElementById("car");

let carLane = 1;
let score = 0;
let running = false;
let obstacles = [];
let speed = 4;
let gameLoop;
let spawnLoop;

let best = Number(localStorage.getItem("neonBest") || 0);

document.getElementById("best").textContent = best;

function setCar(){

  const positions = ["16.66%","50%","83.33%"];

  car.style.left = positions[carLane];

}

function moveLeft(){

  if(!running) return;

  if(carLane > 0){

    carLane--;
    setCar();

  }

}

function moveRight(){

  if(!running) return;

  if(carLane < 2){

    carLane++;
    setCar();

  }

}

document.addEventListener("keydown",function(e){

  if(e.key === "ArrowLeft")
    moveLeft();

  if(e.key === "ArrowRight")
    moveRight();

});

function createObstacle(){

  if(!running) return;

  const obstacle = document.createElement("div");

  obstacle.className = "obstacle";

  const lane = Math.floor(Math.random()*3);

  const positions = ["16.66%","50%","83.33%"];

  obstacle.style.left = positions[lane];

  obstacle.style.top = "-100px";

  road.appendChild(obstacle);

  obstacles.push({
    element:obstacle,
    lane:lane,
    y:-100
  });

}

function collision(a,b){

  const r1 = a.getBoundingClientRect();
  const r2 = b.getBoundingClientRect();

  return !(
    r1.bottom < r2.top ||
    r1.top > r2.bottom ||
    r1.right < r2.left ||
    r1.left > r2.right
  );

}

function update(){

  if(!running) return;

  obstacles.forEach((ob,index)=>{

    ob.y += speed;

    ob.element.style.top = ob.y+"px";

    if(
      ob.lane === carLane &&
      collision(car,ob.element)
    ){

      endGame();

    }

    if(ob.y > road.clientHeight){

      ob.element.remove();

      obstacles.splice(index,1);

      score++;

      document.getElementById("score").textContent = score;

      if(score % 10 === 0){

        speed += .5;

      }

    }

  });

  gameLoop = requestAnimationFrame(update);

}

function startGame(){

  cancelAnimationFrame(gameLoop);
  clearInterval(spawnLoop);

  obstacles.forEach(o => o.element.remove());

  obstacles = [];

  score = 0;
  speed = 4;
  carLane = 1;

  document.getElementById("score").textContent = "0";

  document.getElementById("message").textContent = "";

  document.getElementById("message").className = "";

  setCar();

  running = true;

  spawnLoop = setInterval(createObstacle,900);

  gameLoop = requestAnimationFrame(update);

}

function endGame(){

  if(!running) return;

  running = false;

  clearInterval(spawnLoop);
  cancelAnimationFrame(gameLoop);

  if(score > best){

    best = score;

    localStorage.setItem("neonBest",best);

    document.getElementById("best").textContent = best;

  }

  const message = document.getElementById("message");

  message.textContent =
    "💥 Game Over! Score: " + score;

  message.className = "gameover";

}

setCar();
startGame();

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Jungle Adventure - PlayNova</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#07130b;
  color:#fff;
  font-family:Arial,sans-serif;
  text-align:center;
  padding:15px
}

.game{
  width:min(95vw,600px);
  margin:auto
}

h1{
  color:#7cff72;
  margin:8px 0
}

.info{
  color:#b9c8ba;
  margin-bottom:12px
}

.stats{
  display:flex;
  justify-content:center;
  gap:10px;
  margin-bottom:12px
}

.stat{
  background:#142319;
  padding:9px 18px;
  border-radius:10px
}

.stat span{
  color:#7cff72;
  font-weight:bold
}

.jungle{
  position:relative;
  width:100%;
  height:520px;
  overflow:hidden;
  background:
    radial-gradient(circle at 20% 20%,#3d8f43 0 8%,transparent 9%),
    radial-gradient(circle at 80% 30%,#2d7135 0 10%,transparent 11%),
    linear-gradient(#165b2a,#0b3018);
  border:3px solid #7cff72;
  border-radius:15px
}

.player{
  position:absolute;
  width:44px;
  height:44px;
  left:50%;
  bottom:35px;
  transform:translateX(-50%);
  background:#ffb703;
  border:3px solid white;
  border-radius:50%;
  box-shadow:0 0 15px #ffb703;
  z-index:5
}

.coin{
  position:absolute;
  width:25px;
  height:25px;
  background:#ffd60a;
  border:3px solid #fff;
  border-radius:50%;
  box-shadow:0 0 12px #ffd60a;
}

.enemy{
  position:absolute;
  width:38px;
  height:38px;
  background:#d62828;
  border:2px solid #ff8a8a;
  border-radius:50%;
  box-shadow:0 0 12px #d62828
}

.obstacle{
  position:absolute;
  width:45px;
  height:45px;
  background:#633b1f;
  border-radius:8px
}

.controls{
  margin-top:15px;
  display:flex;
  justify-content:center;
  gap:10px
}

button{
  border:0;
  border-radius:10px;
  padding:13px 20px;
  background:#18331f;
  color:#fff;
  font-size:18px;
  cursor:pointer
}

button:hover{
  background:#2c5837
}

.restart{
  margin-top:10px;
  background:#26733a
}

#message{
  min-height:25px;
  margin-top:12px;
  color:#ffe600;
  font-weight:bold
}

.gameover{
  color:#ff4d4d!important
}
</style>
</head>

<body>

<div class="game">

<h1>🌴 Jungle Adventure</h1>

<div class="info">
Collect the coins and survive the jungle!
</div>

<div class="stats">
<div class="stat">
Coins: <span id="score">0</span>
</div>

<div class="stat">
Lives: <span id="lives">3</span>
</div>
</div>

<div class="jungle" id="jungle">

<div class="player" id="player"></div>

</div>

<div class="controls">
<button onclick="move(-1,0)">⬅️</button>
<button onclick="move(1,0)">➡️</button>
<button onclick="move(0,-1)">⬆️</button>
<button onclick="move(0,1)">⬇️</button>
</div>

<button class="restart" onclick="startGame()">
🔄 Restart
</button>

<div id="message"></div>

</div>

<script>

const jungle=document.getElementById("jungle");
const player=document.getElementById("player");

let px=50;
let py=85;

let score=0;
let lives=3;
let running=false;

let coins=[];
let enemies=[];
let loop;
let spawnTimer;

function setPlayer(){

  player.style.left=px+"%";
  player.style.top=py+"%";
  player.style.bottom="auto";

}

function move(x,y){

  if(!running)return;

  px+=x*5;
  py+=y*5;

  px=Math.max(5,Math.min(95,px));
  py=Math.max(8,Math.min(92,py));

  setPlayer();

  checkObjects();

}

document.addEventListener("keydown",function(e){

  if(e.key==="ArrowLeft")move(-1,0);
  if(e.key==="ArrowRight")move(1,0);
  if(e.key==="ArrowUp")move(0,-1);
  if(e.key==="ArrowDown")move(0,1);

});

function distance(a,b){

  let dx=a.x-b.x;
  let dy=a.y-b.y;

  return Math.sqrt(dx*dx+dy*dy);

}

function createCoin(){

  if(!running)return;

  let c=document.createElement("div");

  c.className="coin";

  let x=8+Math.random()*84;
  let y=10+Math.random()*75;

  c.style.left=x+"%";
  c.style.top=y+"%";

  jungle.appendChild(c);

  coins.push({
    element:c,
    x:x,
    y:y
  });

}

function createEnemy(){

  if(!running)return;

  let e=document.createElement("div");

  e.className="enemy";

  let side=Math.floor(Math.random()*4);

  let x,y;

  if(side===0){
    x=-5;
    y=Math.random()*90;
  }

  if(side===1){
    x=105;
    y=Math.random()*90;
  }

  if(side===2){
    x=Math.random()*100;
    y=-5;
  }

  if(side===3){
    x=Math.random()*100;
    y=105;
  }

  e.style.left=x+"%";
  e.style.top=y+"%";

  jungle.appendChild(e);

  enemies.push({
    element:e,
    x:x,
    y:y,
    speed:.3+Math.random()*.25
  });

}

function checkObjects(){

  coins.forEach((c,i)=>{

    if(distance(
      {x:px,y:py},
      {x:c.x,y:c.y}
    )<7){

      c.element.remove();
      coins.splice(i,1);

      score++;

      document.getElementById("score")
        .textContent=score;

    }

  });

  enemies.forEach((e,i)=>{

    if(distance(
      {x:px,y:py},
      {x:e.x,y:e.y}
    )<7){

      e.element.remove();
      enemies.splice(i,1);

      lives--;

      document.getElementById("lives")
        .textContent=lives;

      if(lives<=0){

        endGame();

      }

    }

  });

}

function update(){

  if(!running)return;

  enemies.forEach(e=>{

    let dx=px-e.x;
    let dy=py-e.y;

    let d=Math.sqrt(dx*dx+dy*dy);

    if(d>0){

      e.x+=(dx/d)*e.speed;
      e.y+=(dy/d)*e.speed;

    }

    e.element.style.left=e.x+"%";
    e.element.style.top=e.y+"%";

  });

  checkObjects();

  loop=requestAnimationFrame(update);

}

function startGame(){

  cancelAnimationFrame(loop);
  clearInterval(spawnTimer);

  coins.forEach(c=>c.element.remove());
  enemies.forEach(e=>e.element.remove());

  coins=[];
  enemies=[];

  score=0;
  lives=3;

  px=50;
  py=85;

  document.getElementById("score").textContent="0";
  document.getElementById("lives").textContent="3";

  document.getElementById("message").textContent="";
  document.getElementById("message").className="";

  setPlayer();

  running=true;

  for(let i=0;i<5;i++){
    createCoin();
  }

  spawnTimer=setInterval(function(){

    createCoin();

    if(Math.random()>.25){
      createEnemy();
    }

  },1200);

  loop=requestAnimationFrame(update);

}

function endGame(){

  if(!running)return;

  running=false;

  clearInterval(spawnTimer);
  cancelAnimationFrame(loop);

  let m=document.getElementById("message");

  m.textContent=
    "💀 Game Over! Coins collected: "+score;

  m.className="gameover";

}

setPlayer();
startGame();

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#07140b;
  color:white;
  font-family:Arial,sans-serif;
  min-height:100vh;
  text-align:center;
  padding:15px;
}

.game{
  width:min(95vw,700px);
  margin:auto;
}

h1{
  margin:8px 0;
  color:#7cff6b;
}

.info{
  color:#c7d9c9;
  margin-bottom:12px;
}

.stats{
  display:flex;
  justify-content:center;
  gap:10px;
  margin-bottom:12px;
}

.stat{
  background:#102719;
  padding:9px 18px;
  border-radius:10px;
}

.stat span{
  color:#7cff6b;
  font-weight:bold;
}

.field{
  position:relative;
  width:100%;
  aspect-ratio:16/10;
  background:#16823b;
  border:5px solid white;
  border-radius:15px;
  overflow:hidden;
}

.center-line{
  position:absolute;
  left:50%;
  top:0;
  width:3px;
  height:100%;
  background:white;
}

.center-circle{
  position:absolute;
  left:50%;
  top:50%;
  width:90px;
  height:90px;
  border:3px solid white;
  border-radius:50%;
  transform:translate(-50%,-50%);
}

.goal{
  position:absolute;
  right:-5px;
  top:30%;
  width:70px;
  height:40%;
  border:4px solid white;
  border-right:0;
}

.ball{
  position:absolute;
  width:34px;
  height:34px;
  background:white;
  border-radius:50%;
  transform:translate(-50%,-50%);
  left:65%;
  top:50%;
  transition:.25s;
}

.player{
  position:absolute;
  width:44px;
  height:44px;
  background:#1677ff;
  border:3px solid white;
  border-radius:50%;
  transform:translate(-50%,-50%);
  left:30%;
  top:50%;
}

.controls{
  margin-top:15px;
  display:grid;
  grid-template-columns:repeat(3,70px);
  justify-content:center;
  gap:8px;
}

.controls button,
.shoot{
  border:0;
  border-radius:10px;
  padding:13px;
  background:#243d2a;
  color:white;
  font-size:18px;
  cursor:pointer;
}

.controls button:hover,
.shoot:hover{
  background:#2f713e;
}

.shoot{
  margin-top:12px;
  background:#0e9f45;
  font-weight:bold;
}

#message{
  min-height:25px;
  margin-top:12px;
  color:#ffe66d;
  font-weight:bold;
}
</style>

</head>

<body>

<div class="game">

<h1>⚽ Football Star</h1>

<div class="info">
Move your player and score a goal!
</div>

<div class="stats">

<div class="stat">
Goals: <span id="score">0</span>
</div>

<div class="stat">
Shots: <span id="shots">0</span>
</div>

</div>

<div class="field" id="field">

<div class="center-line"></div>
<div class="center-circle"></div>
<div class="goal"></div>

<div class="player" id="player"></div>
<div class="ball" id="ball"></div>

</div>

<div class="controls">

<div></div>
<button onclick="move(0,-5)">⬆️</button>
<div></div>

<button onclick="move(-5,0)">⬅️</button>
<button onclick="move(0,5)">⬇️</button>
<button onclick="move(5,0)">➡️</button>

</div>

<button class="shoot" onclick="shoot()">
⚽ SHOOT!
</button>

<div id="message"></div>

</div>

<script>

let px=30;
let py=50;

let bx=65;
let by=50;

let score=0;
let shots=0;

function move(x,y){

  px+=x;
  py+=y;

  px=Math.max(8,Math.min(55,px));
  py=Math.max(8,Math.min(92,py));

  document.getElementById("player").style.left=px+"%";
  document.getElementById("player").style.top=py+"%";
}

function shoot(){

  shots++;

  document.getElementById("shots").textContent=shots;

  let distance=Math.sqrt(
    Math.pow(px-bx,2)+
    Math.pow(py-by,2)
  );

  if(distance<18){

    let chance=Math.random();

    if(chance>0.25){

      score++;

      document.getElementById("score").textContent=score;

      document.getElementById("message").textContent=
      "🎉 GOAL! Great shot!";

      bx=92;
      by=50;

      document.getElementById("ball").style.left=bx+"%";
      document.getElementById("ball").style.top=by+"%";

      setTimeout(resetBall,1000);

    }else{

      document.getElementById("message").textContent=
      "🧤 Saved by the goalkeeper!";

    }

  }else{

    document.getElementById("message").textContent=
    "❌ You are too far from the ball!";

  }
}

function resetBall(){

  bx=65;
  by=50;

  document.getElementById("ball").style.left=bx+"%";
  document.getElementById("ball").style.top=by+"%";

  document.getElementById("message").textContent="";
}

</script>

</body>
</html>
